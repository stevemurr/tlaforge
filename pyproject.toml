[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "tlaforge"
version = "0.1.0"
description = "Build TLA+ state machine specs with Python builders."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Steve Murr" }
]
dependencies = [
  "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "live_network: opt-in tests that hit a real local model provider",
]

[tool.coverage.run]
omit = [
  "tests/*",
  "examples/*",
]

[tool.coverage.report]
omit = [
  "tests/*",
  "examples/*",
]
